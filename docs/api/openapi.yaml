    $ref: ./paths/approvals.yaml#/~1approval-instances~1{approval_id}~1decisions
  /approval-instances/{approval_id}/comments:
    $ref: ./paths/approvals.yaml#/~1approval-instances~1{approval_id}~1comments
  /imports:
    $ref: ./paths/files.yaml#/~1imports
  /imports/{import_id}:
