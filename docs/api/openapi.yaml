openapi: 3.1.0
info:
  title: Curriculum Management API
  version: 0.1.0
  description: Target external API. MVP implements curriculum editing, validation, basic versions and XLSX export; import and advanced versioning start in Post-MVP 1, approval starts in Post-MVP 2.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: /api/v1
security:
- bearerAuth: []
tags:
- name: Curricula
  description: Current curriculum state and its editable entities.
  x-release: MVP
- name: Versions
  description: Immutable snapshots in MVP; restoration and comparison in Post-MVP 1.
  x-release: MVP
- name: Validation
  description: Regulatory validation runs and results.
  x-release: MVP
- name: Approval
  description: Approval workflows, decisions and comments introduced in Post-MVP 2.
  x-release: Post-MVP 2
- name: Files
  description: Synchronous XLSX export in MVP; direct multipart import introduced in Post-MVP 1.
  x-release: MVP
paths:
  /curricula:
    $ref: ./paths/curricula.yaml#/~1curricula
  /curricula/{curriculum_id}:
    $ref: ./paths/curricula.yaml#/~1curricula~1{curriculum_id}
  /curricula/{curriculum_id}/disciplines:
