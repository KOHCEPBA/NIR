Import:
  type: object
  required:
  - id
  - import_type
  - status
  - file_name
  - file_size_bytes
  - file_sha256
  - normalized_payload
  - issues
  - created_at
  properties:
    id:
      type: string
      format: uuid
    import_type:
      type: string
      enum:
      - CURRICULUM
      - REGULATORY_DOCUMENT
    status:
      type: string
      enum:
      - READY_FOR_REVIEW
      - APPLIED
      - REJECTED
    file_name:
      type: string
      maxLength: 255
    file_size_bytes:
      type: integer
      minimum: 1
      maximum: 52428800
    file_sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    normalized_payload:
      type: object
      additionalProperties: true
    issues:
      type: array
      items:
        $ref: '#/ImportIssue'
    created_at:
      type: string
      format: date-time
    applied_at:
      type:
      - string
      - 'null'
      format: date-time
ImportIssue:
  type: object
  required:
  - code
  - severity
  - message
  properties:
    code:
      type: string
    severity:
      type: string
      enum:
      - WARNING
      - ERROR
    source_location:
      type:
      - string
      - 'null'
    message:
      type: string
