/curricula:
  get:
    tags:
    - Curricula
    summary: List curricula
    operationId: listCurricula
    parameters:
    - $ref: ../components/parameters.yaml#/Cursor
    - $ref: ../components/parameters.yaml#/Limit
    - name: educational_program_id
      in: query
      schema:
        type: string
        format: uuid
    - name: training_direction_id
      in: query
      schema:
        type: string
        format: uuid
    - name: admission_year
      in: query
      schema:
        type: integer
        minimum: 2000
        maximum: 2200
    responses:
      '200':
        description: Curriculum page
        content:
          application/json:
            schema:
              $ref: ../components/schemas/curricula.yaml#/CurriculumPage
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      default:
        $ref: ../components/responses.yaml#/Error
  post:
    tags:
    - Curricula
    summary: Create a curriculum
    operationId: createCurriculum
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/curricula.yaml#/CurriculumCreate
    responses:
      '201':
        description: Curriculum created
        headers:
          Location:
            $ref: ../components/headers.yaml#/Location
          ETag:
            $ref: ../components/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/curricula.yaml#/Curriculum
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      default:
        $ref: ../components/responses.yaml#/Error
/curricula/{curriculum_id}:
  parameters:
  - $ref: ../components/parameters.yaml#/CurriculumId
  get:
    tags:
    - Curricula
    summary: Get a curriculum
    operationId: getCurriculum
    parameters:
    - $ref: ../components/parameters.yaml#/IfNoneMatch
    responses:
      '200':
        description: Current editable curriculum
        headers:
          ETag:
            $ref: ../components/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/curricula.yaml#/Curriculum
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '304':
        description: Curriculum revision has not changed
      default:
        $ref: ../components/responses.yaml#/Error
  patch:
    tags:
    - Curricula
    summary: Update curriculum metadata
    operationId: updateCurriculum
    parameters:
    - $ref: ../components/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/merge-patch+json:
          schema:
            $ref: ../components/schemas/curricula.yaml#/CurriculumPatch
    responses:
      '200':
        description: Curriculum updated
        headers:
          ETag:
            $ref: ../components/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/curricula.yaml#/Curriculum
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      default:
        $ref: ../components/responses.yaml#/Error
  delete:
    tags:
    - Curricula
    summary: Archive a curriculum
    operationId: archiveCurriculum
    parameters:
    - $ref: ../components/parameters.yaml#/IfMatch
    responses:
      '204':
        description: Curriculum archived
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      default:
        $ref: ../components/responses.yaml#/Error
